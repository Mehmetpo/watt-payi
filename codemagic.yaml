workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mehmetcebe.wattpayi
      vars:
        BUNDLE_ID: "com.mehmetcebe.wattpayi"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      groups:
        - watt_payi_env
      node: latest
      xcode: latest
    integrations:
      app_store_connect: watt
    scripts:
      - name: Check privacy policy URL
        script: |
          case "$VITE_PRIVACY_POLICY_URL" in
            https://*) ;;
            *) echo "VITE_PRIVACY_POLICY_URL must be a public https URL (set it in the watt_payi_env group)"; exit 1 ;;
          esac
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
