workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mehmetcebe.wattpayi
      vars:
        BUNDLE_ID: "com.mehmetcebe.wattpayi"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        VITE_SUPABASE_URL: "https://vwdgadvnatgjkmhikuax.supabase.co"
        VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3ZGdhZHZuYXRnamttaGlrdWF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMTUxMDIsImV4cCI6MjEwMjc5MTEwMn0.lmf0kQ1OBgqdeyhPMLtbmeVdepCUIkJoBhbGsdKEDVg"
        VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAEaWsjOlt6gAQfWI"
      node: latest
      xcode: latest
    integrations:
      app_store_connect: watt
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
